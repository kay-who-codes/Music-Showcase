<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <clipPath id="pageClip">
      <rect id="pageClipRect" x="0" y="0" width="500" height="500">
    </rect>
  </clipPath>
</defs>
<g transform="translate(0.08,-0.467) translate(250,250) rotate(0) scale(1.349,1.349) translate(-250,-250)">
  <g transform="translate(0,0) translate(250,250) rotate(0) scale(1,1) translate(-250,-250)">
    <g transform="translate(250, 250)">
      <!-- Outer Shadow Layer -->
      <circle r="180" fill="#EAB308" filter="url(#drop-shadow)">
    </circle>
    <!-- Outer Bevel Edge -->
    <circle r="180" fill="url(#rim-gradient)">
  </circle>
  <!-- Main Yellow Disc Surface -->
  <circle r="178" fill="url(#cd-base)">
</circle>
<!-- Sheen & Iridescent Specular Light Cones -->
<!-- Primary sheen angled slice -->
<path d="M 0 0 L -126 -126 A 178 178 0 0 1 126 -126 Z" fill="url(#iridescent-1)">
</path>
<!-- Secondary opposite sheen slice -->
<path d="M 0 0 L 126 126 A 178 178 0 0 1 -126 126 Z" fill="url(#iridescent-1)">
</path>
<!-- Cross-angle soft reflection -->
<path d="M 0 0 L -164 68 A 178 178 0 0 1 -68 -164 Z" fill="url(#iridescent-2)">
</path>
<path d="M 0 0 L 164 -68 A 178 178 0 0 1 68 164 Z" fill="url(#iridescent-2)">
</path>
<!-- Disc Fine Grooves (Data Tracks) -->
<circle r="165" fill="none" stroke="#CA8A04" stroke-opacity="0.15" stroke-width="1">
</circle>
<circle r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="0.75">
</circle>
<circle r="135" fill="none" stroke="#CA8A04" stroke-opacity="0.12" stroke-width="1">
</circle>
<circle r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75">
</circle>
<circle r="105" fill="none" stroke="#CA8A04" stroke-opacity="0.1" stroke-width="0.5">
</circle>
<circle r="90" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="0.75">
</circle>
<circle r="75" fill="none" stroke="#CA8A04" stroke-opacity="0.15" stroke-width="0.5">
</circle>
<!-- Mirror / Lead-in Program Boundary Line -->
<circle r="68" fill="none" stroke="#A16207" stroke-opacity="0.25" stroke-width="1.5">
</circle>
<!-- Inner Clear Plastic Ring (Clamping Area) -->
<circle r="67" fill="#FEF9C3" fill-opacity="0.5">
</circle>
<circle r="67" fill="url(#plastic-sheen)">
</circle>
<circle r="67" fill="none" stroke="#EAB308" stroke-opacity="0.3" stroke-width="1">
</circle>
<!-- Stacking Ring (Subtle raised plastic ridge) -->
<circle r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5">
</circle>
<circle r="44" fill="none" stroke="#CA8A04" stroke-opacity="0.15" stroke-width="1">
</circle>
<!-- Inner Transparent Hub Hole Boundary -->
<circle r="26" fill="none" stroke="#EAB308" stroke-opacity="0.4" stroke-width="1">
</circle>
<!-- Center Hole (Spindle) -->
<circle r="25" fill="none">
</circle>
<!-- Center Hole Inner Shadow for Depth -->
<circle r="25" fill="none" stroke="#1E1B18" stroke-opacity="0.08" stroke-width="1.5">
</circle>
</g>
</g>
</g>
<g transform="translate(-2.407,-0.231) translate(252.062,249.478) rotate(0) scale(1.298,1.298) translate(-252.062,-249.478)">
